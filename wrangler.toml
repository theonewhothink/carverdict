# Root wrangler config — deploys the generated static site to the "carsite" Worker.
# CI runs: wrangler deploy  (see build.sh)
name = "carsite"
compatibility_date = "2026-07-19"
main = "workers/redirect.js"

# Google sign-in. The OAuth client id is public by design (it is embedded in the sign-in
# page); the Worker verifies the ID token Google Identity Services returns against
# Google's JWKS, so no client secret is needed. Project "motorjury" in Google Cloud,
# client "MotorJury web sign-in", origin https://motorjury.com.
[vars]
GOOGLE_CLIENT_ID = "519984973200-q94tosv123gmigjvknvtmnotilhs30ak.apps.googleusercontent.com"

[assets]
directory = "./site"
not_found_handling = "404-page"
binding = "ASSETS"
run_worker_first = true

# Accounts, likes and owner surveys live in a Durable Object with the SQLite storage
# backend. This is the one database Cloudflare provisions from the deploy itself — no
# console visit, no API token, no database id to paste in — which is why the login works
# on the first push instead of waiting on an account signup.
[[durable_objects.bindings]]
name = "HUB"
class_name = "HubDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["HubDO"]
