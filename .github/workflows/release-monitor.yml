name: Monitor published release
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check sampled routes and exact publication source
        run: python scripts/monitor_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-monitor
          path: verification/monitor-release.json
          retention-days: 14
