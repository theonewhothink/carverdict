name: Build & deploy CarVerdict

on:
  push:
    branches: [main, "codex/**"]
  workflow_dispatch:
    inputs:
      max_model_pages:
        description: "Model pages to generate (site file cap is 20,000)"
        default: "15300"

permissions:
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install build deps
        run: pip install pillow

      - name: Build and verify the actual publication pipeline
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://motorjury.com' }}
          MOTORJURY_PREVIEW: '1'
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund @anthropic-ai/sdk@0.128.0
          bash scripts/build_inner.sh

      # Publishing is NOT done here. Cloudflare Workers Builds is connected directly to this
      # repository (Worker "carsite"): on every push to main Cloudflare runs `bash build.sh`
      # and then `npx wrangler deploy`. That removes the API-token dependency entirely — there
      # is no Cloudflare credential in this repository, and nothing to rotate or leak.
      # This workflow stays as the fast pre-flight check: build, dead-link gate, unit tests.
      - name: Deployment note
        run: echo "Publish handled by Cloudflare Workers Builds (Worker 'carsite', branch main)."

      - name: Ping IndexNow
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          ORIGIN: ${{ vars.SITE_ORIGIN || 'https://motorjury.com' }}
        run: |
          python3 - <<'PY'
          import json, os, re, time, urllib.request, urllib.parse
          import xml.etree.ElementTree as ET
          from pathlib import Path
          origin = os.environ['ORIGIN'].rstrip('/')
          host = urllib.parse.urlsplit(origin)
          if host.scheme != 'https' or not host.netloc or host.path:
              raise ValueError('IndexNow requires the canonical HTTPS origin')
          # This published verification file authorises URL notifications only;
          # it is not a hosting, account, or search-console credential.
          key = Path('static/4496abb8fd9de5938fb8c59a06f34eb1.txt').read_text().strip()
          if not re.fullmatch(r'[0-9a-f]{32}', key):
              raise ValueError('Invalid IndexNow verification file')
          location = origin + '/' + key + '.txt'
          last_error = "no response"
          agent = {'User-Agent': 'MotorJury-IndexNow/1.0 (+https://motorjury.com/sources/)'}
          for attempt in range(3):
              try:
                  with urllib.request.urlopen(urllib.request.Request(location, headers=agent), timeout=10) as response:
                      if response.read().decode().strip() == key:
                          break
                      last_error = f'HTTP {response.status}, verification content differs'
              except urllib.error.HTTPError as exc:
                  last_error = f"HTTP {exc.code}"
              except OSError as exc:
                  last_error = type(exc).__name__
              if attempt == 2:
                  print(f'Public verification pre-check unavailable ({last_error}); IndexNow will validate the published keyLocation itself.')
                  break
              time.sleep(5)
          # GitHub's build is an isolated preview. Submit the LIVE production
          # sitemap; IndexNow independently verifies the public keyLocation.
          with urllib.request.urlopen(urllib.request.Request(origin + '/sitemap-0.xml', headers=agent), timeout=20) as response:
              sitemap = ET.fromstring(response.read())
          urls = list(dict.fromkeys(node.text for node in sitemap.iter()
                     if node.tag.endswith('}loc') and node.text
                     and urllib.parse.urlsplit(node.text).scheme == 'https'
                     and urllib.parse.urlsplit(node.text).netloc == host.netloc
                     and not urllib.parse.urlsplit(node.text).query
                     and not urllib.parse.urlsplit(node.text).fragment))
          if not urls:
              raise RuntimeError('Live sitemap has no eligible URLs; no notification sent')
          for offset in range(0, len(urls), 10000):
              batch = urls[offset:offset + 10000]
              payload = json.dumps({'host': host.netloc, 'key': key, 'keyLocation': location, 'urlList': batch}).encode()
              request = urllib.request.Request('https://api.indexnow.org/indexnow', data=payload,
                        headers={'Content-Type': 'application/json; charset=utf-8', **agent}, method='POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  if response.status not in (200, 202):
                      raise RuntimeError('IndexNow did not accept the notification')
                  print(f'IndexNow acknowledged {len(batch)} published sitemap URLs (HTTP {response.status}); receipt is not indexing.')
          PY


