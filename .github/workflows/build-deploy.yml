name: Build & deploy CarVerdict

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"      # nightly data refresh + rebuild
  workflow_dispatch:
    inputs:
      max_model_pages:
        description: "Model pages to generate (site file cap is 20,000)"
        default: "15300"

permissions:
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: pip install pillow

      - name: Full-scale model pages
        # CI has no 10 MB upload ceiling, so publish the complete catalogue
        run: |
          MAX="${{ github.event.inputs.max_model_pages || '15300' }}"
          sed -i "s/^MAX_MODEL_PAGES = .*/MAX_MODEL_PAGES = ${MAX}/" scripts/build_models.py
          grep -n "^MAX_MODEL_PAGES" scripts/build_models.py

      - name: Refresh NHTSA / EPA deltas
        # Only rebuild the DB when the raw API caches are present — otherwise the committed
        # seed database (data/cars.sqlite) would be overwritten with an empty one.
        if: ${{ hashFiles('data/raw/**') != '' }}
        continue-on-error: true          # never block a deploy on an upstream outage
        run: python scripts/cardata_ingest.py --build

      - name: Verify seed database
        run: |
          python - <<'PY'
          import sqlite3, sys
          n = sqlite3.connect('data/cars.sqlite').execute('select count(*) from model_years').fetchone()[0]
          print(f'model_years in DB: {n}')
          sys.exit(0 if n >= 10 else 1)
          PY

      - name: Generate site
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://motorjury.com' }}
        run: |
          python scripts/canonicalize_models.py
          python scripts/score_model_years.py
          python scripts/price_model.py
          python scripts/make_icons.py
          python scripts/build_people.py --harvest-only
          python scripts/build_models.py --plan
          python scripts/gen_site.py
          python scripts/build_models.py
          python scripts/build_library.py
          python scripts/build_engage.py
          python scripts/build_events.py
          python scripts/build_stories.py
          python scripts/build_problems.py
          python scripts/build_people.py --from-cache
          python scripts/build_social.py
          python scripts/localize.py
          python scripts/polish.py

      - name: QA gate — no dead internal links
        run: |
          python - <<'PY'
          import re, os, glob, sys
          pages = glob.glob('site/**/*.html', recursive=True)
          hrefs = set()
          PAT = re.compile(r"""href=(?:"(/[^"#?]*)"|'(/[^'#?]*)')""")
          for p in pages:
              for a, b in PAT.findall(open(p).read()):
                  hrefs.add(a or b)
          skip = ('/api', '/assets', '/cdn-cgi', '/og/')
          allow = {'/sitemap.xml', '/llms.txt', '/robots.txt', '/ads.txt', '/favicon.ico',
                   '/favicon.svg', '/site.webmanifest', '/mask-icon.svg', '/apple-touch-icon.png'}
          dead = [u for u in hrefs
                  if not (os.path.exists('site' + u) or os.path.exists(('site' + u).rstrip('/') + '/index.html'))
                  and not u.startswith(skip) and u not in allow]
          print(f"pages={len(pages)} links={len(hrefs)} dead={len(dead)}")
          if dead:
              print("DEAD:", dead[:20]); sys.exit(1)
          PY

      - name: Calculator unit tests
        run: node --test workers/calc.test.mjs workers/hub.test.mjs workers/vin.test.mjs

      # Publishing is NOT done here. Cloudflare Workers Builds is connected directly to this
      # repository (Worker "carsite"): on every push to main Cloudflare runs `bash build.sh`
      # and then `npx wrangler deploy`. That removes the API-token dependency entirely — there
      # is no Cloudflare credential in this repository, and nothing to rotate or leak.
      # This workflow stays as the fast pre-flight check: build, dead-link gate, unit tests.
      - name: Deployment note
        run: echo "Publish handled by Cloudflare Workers Builds (Worker 'carsite', branch main)."

      - name: Ping IndexNow
        continue-on-error: true
        env:
          ORIGIN: ${{ vars.SITE_ORIGIN }}
          KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          set -u
          if [ -n "$ORIGIN" ] && [ -n "$KEY" ]; then
            curl -s -X POST "https://api.indexnow.org/indexnow" \
              -H "Content-Type: application/json" \
              -d "{\"host\":\"${ORIGIN#https://}\",\"key\":\"${KEY}\",\"urlList\":[\"${ORIGIN}/\"]}" || true
          else
            echo "SITE_ORIGIN or INDEXNOW_KEY not set - skipping."
          fi
