name: Build & deploy CarVerdict

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"      # nightly data refresh + rebuild
  workflow_dispatch:
    inputs:
      max_model_pages:
        description: "Model pages to generate (site file cap is 20,000)"
        default: "15300"

permissions:
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: pip install pillow

      - name: Full-scale model pages
        # CI has no 10 MB upload ceiling, so publish the complete catalogue
        run: |
          MAX="${{ github.event.inputs.max_model_pages || '15300' }}"
          sed -i "s/^MAX_MODEL_PAGES = .*/MAX_MODEL_PAGES = ${MAX}/" scripts/build_models.py
          grep -n "^MAX_MODEL_PAGES" scripts/build_models.py

      - name: Refresh NHTSA / EPA deltas
        # Only rebuild the DB when the raw API caches are present — otherwise the committed
        # seed database (data/cars.sqlite) would be overwritten with an empty one.
        if: ${{ hashFiles('data/raw/**') != '' }}
        continue-on-error: true          # never block a deploy on an upstream outage
        run: python scripts/cardata_ingest.py --build

      - name: Verify seed database
        run: |
          python - <<'PY'
          import sqlite3, sys
          n = sqlite3.connect('data/cars.sqlite').execute('select count(*) from model_years').fetchone()[0]
          print(f'model_years in DB: {n}')
          sys.exit(0 if n >= 10 else 1)
          PY

      - name: Generate site
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://carverdict.example' }}
        run: |
          python scripts/build_models.py --plan
          python scripts/gen_site.py
          python scripts/build_models.py
          python scripts/build_library.py
          python scripts/build_engage.py
          python scripts/localize.py

      - name: QA gate — no dead internal links
        run: |
          python - <<'PY'
          import re, os, glob, sys
          pages = glob.glob('site/**/*.html', recursive=True)
          hrefs = set()
          for p in pages:
              hrefs.update(re.findall(r'href="(/[^"#?]*)"', open(p).read()))
          skip = ('/api', '/assets', '/cdn-cgi')
          allow = {'/sitemap.xml', '/llms.txt', '/robots.txt', '/ads.txt'}
          dead = [u for u in hrefs
                  if not (os.path.exists('site' + u) or os.path.exists(('site' + u).rstrip('/') + '/index.html'))
                  and not u.startswith(skip) and u not in allow]
          print(f"pages={len(pages)} links={len(hrefs)} dead={len(dead)}")
          if dead:
              print("DEAD:", dead[:20]); sys.exit(1)
          PY

      - name: Calculator unit tests
        run: node --test workers/calc.test.mjs

      - name: Deploy to Cloudflare Workers
        # Token discovery: the repo's Cloudflare token may be stored under any of several
        # secret names. Each candidate is verified against Cloudflare's token-verify endpoint
        # and the first valid one is used. Secret values are masked by GitHub in all logs.
        # wrangler 4 is required: assets-only Workers (no `main` entry) need v4.
        env:
          CF_A: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_B: ${{ secrets.NEWONE123 }}
          CF_C: ${{ secrets.NEWONE321 }}
          CF_D: ${{ secrets.CF_API_TOKEN }}
          CF_ACCT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -u
          npm install -g wrangler@4 >/dev/null 2>&1
          PICK=""
          N=0
          for CAND in "$CF_A" "$CF_B" "$CF_C" "$CF_D"; do
            N=$((N+1))
            [ -z "$CAND" ] && continue
            CODE=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${CAND}" \
              https://api.cloudflare.com/client/v4/user/tokens/verify)
            echo "candidate #${N}: verify HTTP ${CODE}"
            if [ "$CODE" = "200" ]; then PICK="$CAND"; break; fi
          done
          if [ -z "$PICK" ]; then
            echo "::error::No valid Cloudflare API token found. Add one as a repository secret named CLOUDFLARE_API_TOKEN (Cloudflare dashboard -> My Profile -> API Tokens -> 'Edit Cloudflare Workers' template)."
            exit 1
          fi
          export CLOUDFLARE_API_TOKEN="$PICK"
          export CLOUDFLARE_ACCOUNT_ID="${CF_ACCT:-07330caebabe7034671e295c05accbd6}"
          wrangler deploy

      - name: Ping IndexNow
        continue-on-error: true
        run: |
          ORIGIN="${{ vars.SITE_ORIGIN }}"
          if [ -n "$ORIGIN" ] && [ -n "${{ secrets.INDEXNOW_KEY }}" ]; then
            curl -s -X POST "https://api.indexnow.org/indexnow" \
              -H "Content-Type: application/json" \
              -d "{\"host\":\"${ORIGIN#https://}\",\"key\":\"${{ secrets.INDEXNOW_KEY }}\",\"urlList\":[\"$ORIGIN/\"]}" || true
          fi
